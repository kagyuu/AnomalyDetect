# s_anomaly 設定ファイル
#
# 書式は INI 形式です(拡張子は .properties ですが Java の properties 形式ではありません)。
# このファイルが存在しない場合は、すべて既定値で動作します。
# 未知のキーは警告を出して無視します。値が範囲外の場合は終了コード 3 で終了します。

# ---------------------------------------------------------------------------
# 異常検知アルゴリズムの ON/OFF。既定はすべて true。
#   観点1(瞬間的な外れ値): ALG-A1 〜 ALG-A5
#   観点2(持続的な増加)  : ALG-B1 〜 ALG-B5
# すべて false にすると、検知 0 件のレポートを出力して正常終了(0)します。
# ---------------------------------------------------------------------------
[algorithms]
ALG-A1 = true
ALG-A2 = true
ALG-A3 = true
ALG-A4 = true
ALG-A5 = true
ALG-B1 = true
ALG-B2 = true
ALG-B3 = true
ALG-B4 = true
ALG-B5 = true

# ---------------------------------------------------------------------------
# アルゴリズムのパラメータ。既定値を変えたい行だけを書けば足ります。
# ---------------------------------------------------------------------------
[parameters]

# --- ALG-A1 移動平均乖離率 (直前 N 分の平均・標準偏差からの乖離) ---
# window_minutes : 移動平均を取る窓の幅(分)。現在点は含めません
# k_warn         : この σ 倍率を超えたら WARN 相当
# k_fatal        : この σ 倍率を超えたら FATAL 相当(k_warn より大きいこと)
ALG-A1.window_minutes = 60
ALG-A1.k_warn = 2.0
ALG-A1.k_fatal = 3.0

# --- ALG-A2 Hampel フィルタ (移動中央値 + MAD。外れ値に頑健) ---
ALG-A2.window_minutes = 60
ALG-A2.k = 3.0

# --- ALG-A3 Tukey の外れ値境界 (系列全体の四分位数。窓を持たない) ---
# iqr_fatal は iqr_warn より大きいこと
ALG-A3.iqr_warn = 1.5
ALG-A3.iqr_fatal = 3.0

# --- ALG-A4 EWMA 管理図 (緩やかな水準変化に感度を持つ) ---
# lambda : 指数加重の係数(0 より大きく 1 以下)。小さいほど平滑化が強い
ALG-A4.lambda = 0.2
ALG-A4.k = 3.0

# --- ALG-A5 曜日・時刻別ベースライン (日次・週次の周期性を考慮) ---
# min_weeks : 基準として使うために必要な最小の週数
ALG-A5.z = 3.0
ALG-A5.min_weeks = 2

# --- ALG-B1 短期/長期移動平均のクロス継続 ---
# min_run : 短期 > 長期 が連続すべき点数
ALG-B1.short_minutes = 60
ALG-B1.long_minutes = 1440
ALG-B1.min_run = 60

# --- ALG-B2 Mann-Kendall 傾向検定 (非パラメトリック。増加傾向のみ検知) ---
# bucket_minutes : 集約の単位(分)。計算量 O(n^2) を抑えるため集約してから適用します
# max_buckets    : バケット数の上限。超える場合は bucket_minutes を自動的に拡大します
# p_fatal は p_warn より小さいこと
ALG-B2.bucket_minutes = 60
ALG-B2.p_warn = 0.05
ALG-B2.p_fatal = 0.01
ALG-B2.max_buckets = 2000

# --- ALG-B3 ローリング最小値の単調増加 (メモリリーク検出の定番) ---
# window_minutes : 非重複バケットの幅(分)。各バケットの最小値の並びを見ます
# min_increases  : 非減少が連続すべきバケット数
ALG-B3.window_minutes = 360
ALG-B3.min_increases = 10

# --- ALG-B4 CUSUM (累積和管理図。水準シフトの検出) ---
# baseline_minutes : 系列先頭の、基準水準を求める区間(分)
# h                : 検知の閾値(σ の倍率)
ALG-B4.baseline_minutes = 1440
ALG-B4.h = 5.0

# --- ALG-B5 線形回帰の傾き ---
# min_r2 : 決定係数がこの値以上のときだけ「直線的な増加」とみなします
ALG-B5.min_r2 = 0.7

# --- 全アルゴリズム共通 ---
# min_points         : 判定に必要な最小の点数。満たない系列はスキップします
# sigma_floor_ratio  : 実効的なばらつきの下限(平均に対する比率)
# sigma_floor_abs    : 実効的なばらつきの下限(絶対値)
#   ほとんど一定の系列(pend, susp など小さな整数)で |x-平均|/σ が発散し、
#   些細な変化が大量に検知されるのを防ぐための下限です。
#   誤検知が多い場合は、まずこの 2 つを大きくしてください。
common.min_points = 30
common.sigma_floor_ratio = 0.02
common.sigma_floor_abs = 0.5

# --- イベント統合と脅威度 ---
# severe_pct         : 使用率がこの値を超え、かつ持続的に増加していれば SEVERE
# merge_gap_minutes  : この間隔以内の検知を 1 つのイベントにまとめます
events.severe_pct = 90.0
events.merge_gap_minutes = 60

# ---------------------------------------------------------------------------
# DuckDB(インメモリ)の設定
#   max_memory     : メモリ上限。超えた分は temp_directory へ退避します
#   temp_directory : 退避先。存在しなければ作成します
# ---------------------------------------------------------------------------
[duckdb]
max_memory = 4GB
temp_directory = ./tmp

# ---------------------------------------------------------------------------
# タイムゾーン (※CR-008)
#
#   storage       : DuckDB へ投入するときのタイムゾーン。
#                   レポートの時刻はこのタイムゾーンで出力され、末尾に併記されます
#                   (例 2026-09-06 01:01:00 (UTC))。
#   その他のキー  : 入力ファイルの種別ごとの、読み込むデータのタイムゾーン。
#
#   ★読み込み元と storage が同じ場合、時刻の変換は行いません。
#     既定はすべて UTC のため、通常は変換が一度も発生しません。
#
#   ★IANA の名前付きタイムゾーンのみを受け付けます (例 UTC, Asia/Tokyo)。
#     固定オフセット (+09:00) は使えません。大文字小文字を区別します。
#     誤った名前を書くと、起動時に終了コード 3 で停止します。
# ---------------------------------------------------------------------------
[timezone]
storage = UTC
db_connection = UTC
jvm_gc = UTC
lsf_queue = UTC
sar = UTC

# ---------------------------------------------------------------------------
# チャート (※CR-009)
#
#   アノマリーの状況を SVG の折れ線にして charts/ 配下へ出力し、
#   レポートから画像リンクで参照します。
#
#   enabled              : false にすると一切出力しません
#   min_severity         : この脅威度以上のイベントだけを対象にします
#                          SEVERE / FATAL / WARN / INFO のいずれか
#   max_per_host         : ホストあたりの上限 (脅威度の高い順)
#   max_overlay_per_host : ホストあたりの上限 (同時アノマリーを持つイベント。別枠)
#   pad_ratio            : 異常区間の前後に取る余白の比率
#
#   ★min_severity を SEVERE にすると、重ね合わせのチャートが出なくなります。
#     SEVERE は定義上「観点2 の検知」であり、観点2 のイベントには
#     同時アノマリーが付かないためです。既定を FATAL にしているのはこのためです。
#
#   ★出力量に直結します。30 日規模でイベントは約 7,200 件あります。
#     既定 (ホストあたり 10 + 10) で、17 ホストなら最大 340 枚です。
# ---------------------------------------------------------------------------
[chart]
enabled = true
min_severity = FATAL
max_per_host = 100
max_overlay_per_host = 100
pad_ratio = 0.25

# ---------------------------------------------------------------------------
# sar (sysstat) (※CR-010)
#
#   activities : 取り込む活動種別をカンマ区切りで指定します。
#                cpu        -u  CPU 使用率
#                memory     -r  メモリ
#                swap_space -S  スワップ領域
#                io         -b  I/O 転送
#                load       -q  実行待ち・ロードアベレージ
#                swapping   -W  スワップイン/アウト
#                disk       -d -p  ブロックデバイス (デバイス単位)
#                network    -n DEV ネットワーク (インタフェース単位)
#                nfs        -n NFS  NFS クライアント (※CR-011)
#                nfsd       -n NFSD NFS サーバ (※CR-011)
#
#   ★系列数に直結します。disk と network はデバイス・インタフェース単位で
#     系列が増えるため、S6 (検知) の所要時間が伸びます。
#     大規模環境で実行時間が問題になる場合は、ここを絞ってください。
#
#   ★未知の名前は警告を出して無視します (エラーにはしません)。
#     空にすると sar を取り込みません。
#
#   ★入力ファイルは sa-{ホスト名}-{yyyymmdd}.csv です。
#     `sadf -d` での変換手順は README.md 付録A にあります。
# ---------------------------------------------------------------------------
[sar]
activities = cpu,memory,swap_space,io,load,swapping,disk,network,nfs,nfsd
